- name: Install chrony
  ansible.builtin.dnf:
    name: chrony
    state: present

- name: Deploy chrony.conf
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chronyd

- name: Open NTP in firewall (server only)
  ansible.posix.firewalld:
    service: ntp
    permanent: true
    immediate: true
    state: enabled
  when: chrony_is_server

- name: Enable chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
