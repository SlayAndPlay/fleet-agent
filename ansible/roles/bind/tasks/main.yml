- name: Install BIND
  ansible.builtin.dnf:
    name: [bind, bind-utils]
    state: present

- name: Deploy named.conf (validated)
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: "0640"
    validate: named-checkconf %s
  notify: restart named

- name: Deploy zone file
  ansible.builtin.template:
    src: zone.j2
    dest: "/var/named/{{ bind_zone }}.zone"
    owner: root
    group: named
    mode: "0640"
  notify: restart named

- name: Open DNS in firewall
  ansible.posix.firewalld:
    service: dns
    permanent: true
    immediate: true
    state: enabled

- name: Enable named
  ansible.builtin.service:
    name: named
    state: started
    enabled: true
