- name: Baseline for every host
  hosts: all
  become: true
  roles: [baseline]

- name: NTP server
  hosts: ntp
  become: true
  roles:
    - role: chrony
      vars:
        chrony_is_server: true

- name: NTP clients
  hosts: all:!ntp
  become: true
  roles: [chrony]

- name: DNS server
  hosts: dns
  become: true
  roles: [bind]

- name: DNS clients
  hosts: all
  become: true
  roles: [dns_client]

- name: NFS server
  hosts: nfs
  become: true
  roles: [nfs_server]

- name: NFS clients
  hosts: app
  become: true
  roles: [nfs_client]

- name: Metrics exporter on every host
  hosts: all
  become: true
  roles: [node_exporter]
